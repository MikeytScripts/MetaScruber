# Publishes the files in release/ as a GitHub release. Run it from Actions → Release → Run workflow.
name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v1.4.0"
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "bad tag"; exit 1; }
          gh release create "$TAG" release/MetaScrub.exe release/MetaScrub-arm64.exe release/SHA256SUMS.txt \
            --title "MetaScrub ${TAG}" --notes-file release/NOTES.md --target "$GITHUB_SHA" --latest
